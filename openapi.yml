openapi: 3.1.0
info:
  title: Business Intelligence (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Business Intelligence interface, distilled from the harvested OpenAPI of 159 providers
    in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /dashboards:
    get:
      operationId: listDashboards
      summary: List dashboards
      tags:
      - Dashboards
      x-commons-tier: core
      x-commons-share: 0.862
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Dashboard'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createDashboard
      summary: Create a dashboard
      tags:
      - Dashboards
      x-commons-tier: core
      x-commons-share: 0.621
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /dashboards/{dashboard_id}:
    parameters:
    - $ref: '#/components/parameters/dashboard_id'
    get:
      operationId: getDashboard
      summary: Get a dashboard
      tags:
      - Dashboards
