      x-commons-tier: core
      x-commons-share: 0.552
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    patch:
      operationId: updateDashboard
      summary: Update a dashboard
      tags:
      - Dashboards
      x-commons-tier: core
      x-commons-share: 0.517
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /charts:
